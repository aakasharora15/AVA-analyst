name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build live mode
        run: npm run build
        env:
          VITE_AVA_DATA: live

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AVA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Parity tests run the JS engine through Node, so install its dependencies too.
      - run: npm ci
      - run: python -m pytest tests_py -q
      - name: Seed applies cleanly
        run: |
          psql "$AVA_TEST_DATABASE_URL" -qc "create database seedcheck"
          for f in tests_py/sql/supabase_shim.sql supabase/migrations/*.sql supabase/seed.sql; do
            psql "postgresql://postgres:postgres@localhost:5432/seedcheck" -v ON_ERROR_STOP=1 -q -f "$f"
          done
